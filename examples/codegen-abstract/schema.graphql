# A small schema exercising the parts of GraphQL that the repository-overview
# example doesn't reach: an interface with common fields, a union with none,
# enums, list modifiers, and a deprecated field.
#
# `RepositoryOwner`'s common fields deliberately cover all three field kinds —
# scalar, enum and object — because an interface whose common fields are only
# scalars can't catch an emitter that assumes they always are.

"An ISO-8601 encoded UTC date string."
scalar DateTime

type Query {
  "The owner of a repository — a user or an organization."
  owner(login: String!): RepositoryOwner
  "Search across users, organizations and repositories."
  search(term: String!, first: Int): [SearchResult!]!
}

"Represents an owner of a repository."
interface RepositoryOwner {
  "The username used to log in."
  login: String!
  "A URL pointing to the owner's public avatar."
  avatarUrl: String!
  "The state of the owner's account."
  status: AccountStatus!
  "The repository the owner pins to their profile."
  pinnedRepository: Repository
}

"A user."
type User implements RepositoryOwner {
  login: String!
  avatarUrl: String!
  status: AccountStatus!
  pinnedRepository: Repository
  "The user's public profile bio."
  bio: String
  "When the account was created."
  createdAt: DateTime
  "Repositories the user starred."
  starredRepositoryNames: [String!]
  "The user's email."
  email: String @deprecated(reason: "Use `publicEmail` instead.")
}

"An organization."
type Organization implements RepositoryOwner {
  login: String!
  avatarUrl: String!
  status: AccountStatus!
  pinnedRepository: Repository
  "The organization's public description."
  description: String
  "Members of the organization."
  memberLogins: [String]!
}

"A repository."
type Repository {
  name: String!
  owner: RepositoryOwner!
}

"Anything the search endpoint can return."
union SearchResult = User | Organization | Repository

"The possible states of an account."
enum AccountStatus {
  ACTIVE
  SUSPENDED
}
